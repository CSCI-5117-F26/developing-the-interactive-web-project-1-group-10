<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Missions{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Top Navbar -->
    <header class="top-bar">
        <button class="menu-btn" id="menuBtn">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="category-tabs">
            <a href="#" class="tab active">Following</a>
            <a href="#" class="tab">Category 1</a>
            <a href="#" class="tab">Category 2</a>
            <a href="#" class="tab">Category 3</a>
            <a href="#" class="tab">Category 4</a>
        </nav>

        <a href="#" class="profile-link">
            <div class="profile-avatar"></div>
            <span class="profile-name">Name</span>
        </a>
    </header>

    <!-- Today's Mission Banner -->
    <div class="mission-banner">
        <span>Today's Mission: {% block mission %}Bird{% endblock %}</span>
    </div>

    <!-- Sidebar Menu (hidden by default) -->
    <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav">
            <a href="/">Home</a>
            <a href="/upload">Upload</a>
            <a href="/mission">Mission Tracking</a>
            <a href="/profile">My Profile</a>
        </nav>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Content -->
    <main class="content">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
