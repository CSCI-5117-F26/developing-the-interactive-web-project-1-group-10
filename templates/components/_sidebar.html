<button
    id="sidebarOverlay"
    class="sidebar-overlay"
    type="button"
    aria-label="Close menu"
    tabindex="-1"
></button>

<aside id="sidebar" class="pure-menu sidebar" aria-hidden="true">
    <div class="sidebar-header">
        <button
            id="sidebarClose"
            class="pure-button menu-btn sidebar-close"
            type="button"
            aria-label="Close menu"
        ><i data-lucide="menu" aria-hidden="true"></i></button>
    </div>

    <ul class="pure-menu-list sidebar-list">
        <li class="pure-menu-item">
            <a href="{{ url_for('homepage', category='general') }}" class="pure-menu-link"><i data-lucide="house" class="sidebar-icon" aria-hidden="true"></i>Home</a>
        </li>
        <li class="pure-menu-item">
            <a href="#" class="pure-menu-link"><i data-lucide="clipboard-check" class="sidebar-icon" aria-hidden="true"></i>Mission Tracking</a>
        </li>
        <li class="pure-menu-item sidebar-divider">
            <a href="#" class="pure-menu-link"><i data-lucide="star" class="sidebar-icon" aria-hidden="true"></i>Subscriptions</a>
        </li>
    </ul>

    <div class="sidebar-user-section">
        <p class="sidebar-heading">YOU</p>
        <ul class="pure-menu-list sidebar-list">
            <li class="pure-menu-item">
                <a href="/profile" class="pure-menu-link"><i data-lucide="user-round" class="sidebar-icon" aria-hidden="true"></i>Profile</a>
            </li>
            <li class="pure-menu-item">
                <a href="#" class="pure-menu-link"><i data-lucide="square-play" class="sidebar-icon" aria-hidden="true"></i>Your Videos</a>
            </li>
            <li class="pure-menu-item">
                <a href="#" class="pure-menu-link"><i data-lucide="heart" class="sidebar-icon" aria-hidden="true"></i>Liked Videos</a>
            </li>
            <li class="pure-menu-item">
                <a href="{{ url_for('logout') }}" class="pure-menu-link">Log Out</a>
            </li>
        </ul>
    </div>

    <ul class="pure-menu-list sidebar-list">
        <li class="pure-menu-item sidebar-divider">
            <a href="{{ url_for('change_weather_random') }}" class="pure-menu-link"><i data-lucide="shuffle" class="sidebar-icon" aria-hidden="true"></i>Change weather</a>
        </li>
        <li class="pure-menu-item">
            <span id="currentWeather" class="pure-menu-link">Current: {% if weather_auto %}Loading...{% else %}{{ weather.effect | capitalize }}{% endif %}</span>
        </li>
        <li class="pure-menu-item">
            <a href="{{ url_for('change_weather_auto') }}" class="pure-menu-link"><i data-lucide="cloud-sun" class="sidebar-icon" aria-hidden="true"></i>Auto weather</a>
        </li>
    </ul>

</aside>
