<article class="post-item" data-video-id="{{ post.video_id }}">
    <a href="{{ url_for('profile_other', user_id=post.author_id) }}" class="post-user">
        <div class="post-avatar" aria-hidden="true">
            <i data-lucide="user-round"></i>
        </div>
        <span class="post-username">{{ post.userName }}</span>
    </a>

    <div class="post-card">
        <button class="post-menu" type="button" aria-label="More options">
            <i data-lucide="ellipsis" aria-hidden="true"></i>
        </button>

        <div>
            <video class="post-media" src="{{ post.video }}" alt="{{ post.title }}" controls></video>
        </div>

        <div class="post-copy">
            <h2 class="post-title">{{ post.title }}</h2>
            <p class="post-description">{{ post.description }}</p>
        </div>

        <div class="post-actions" aria-label="Post actions">
            <button
                class="like-button"
                type="button"
                aria-label="{{ 'Unlike' if post.liked else 'Like' }}"
                aria-pressed="{{ 'true' if post.liked else 'false' }}"
                data-like-url="{{ url_for('video_like', video_id=post.video_id) }}"
                data-csrf-token="{{ session.get('csrf_token', '') }}"
            >
                <i data-lucide="heart" aria-hidden="true"></i>
            </button>
            <span class="like-count" aria-live="polite" data-count="{{ post.like_count }}">{{ '999+' if post.like_count > 999 else post.like_count }}</span>
            <button type="button" aria-label="Comment">
                <i data-lucide="message-circle" aria-hidden="true"></i>
            </button>
            <button type="button" aria-label="Share">
                <i data-lucide="arrow-up-right" aria-hidden="true"></i>
            </button>
        </div>
        <p class="like-error" role="status" hidden></p>
    </div>
</article>
