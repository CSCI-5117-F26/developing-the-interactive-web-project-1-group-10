{% extends "base.html" %}
{% block top_bar %}
  {% include "components/_menu_btn.html" %}
  {% include "components/_back.html" %}
{% endblock %}

{% block content %}
<div class="upload-container" style="max-width: 650px; margin: 2rem auto; padding: 0 1rem;">
    
    <form action="{{ url_for('upload_profile_submit') }}" method="POST" enctype="multipart/form-data">
        
        <div style="text-align: center; margin-bottom: 2rem;">
            <label for="image_file" style="cursor: pointer; display: inline-block;">
                <div style="font-size: 2.5rem; margin-bottom: 0.4rem; color: #333;">
                    <i data-lucide="camera" aria-hidden="true">📷</i>
                </div>
                <span class="pure-button" style="background-color: #d1d5db; color: #111; font-weight: 500; border-radius: 6px; padding: 0.5rem 1.5rem; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
                    Select Profile Image
                </span>
            </label>
            <input id="image_file" name="image_file" type="file" accept="image/png, image/gif, image/jpeg" required style="display: none;" onchange="showFileName(this)">
            <div id="file-name-display" style="margin-top: 0.5rem; font-size: 0.85rem; color: #555; font-weight: 500;"></div>
        </div>
        <div>
            <button type="submit" class="pure-button pure-button-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem; border-radius: 6px; font-weight: 600;">
                Upload Image
            </button>
        </div>
    </form>
</div>

<!-- Simple script to display selected image file name -->
<script>
    function showFileName(input) {
        const display = document.getElementById('file-name-display');
        if (input.files && input.files[0]) {
            display.textContent = "Selected file: " + input.files[0].name;
        } else {
            display.textContent = "";
        }
    }
</script>
{% endblock %}
