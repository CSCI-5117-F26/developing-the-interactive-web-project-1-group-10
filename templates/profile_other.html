{% extends "base.html" %}

{% block title %}Profile{% endblock %}
{% block content %}
    <main class="profile">
        <img class="profile-picture" src="{{ url_for('static', filename='images/profile/peter-parker.jpg') }}" alt="Peter Parker">
        <h1>{{ user_info.username }}</h1>
        <p>23 million followers | 17 videos</p>

        <div class="videos">
            {% for post in posts %}
                <div>
                    <img src="{{ url_for('static', filename='images/profile/video-1.png') }}"></video>
                    <p>&#9654; 1 million views</p>
                </div>
            {% endfor %}
        </div>
    </main>
{% endblock %}
