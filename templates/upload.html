{% extends "base.html" %}
{% block top_bar %}
  {% include "components/_menu_btn.html" %}
  {% include "components/_back.html" %}
{% endblock %}

{% block content %}
<div class="upload-container" style="max-width: 650px; margin: 2rem auto; padding: 0 1rem;">
    
    <form action="{{ url_for('upload_submit') }}" method="POST" enctype="multipart/form-data">
        
        <!-- Top Media/File Picker Section -->
        <div style="text-align: center; margin-bottom: 2rem;">
            <label for="video_file" style="cursor: pointer; display: inline-block;">
                <!-- Camera Icon -->
                <div style="font-size: 2.5rem; margin-bottom: 0.4rem; color: #333;">
                    <i data-lucide="camera" aria-hidden="true">📷</i>
                </div>
                <!-- Upload Button Pill -->
                <span class="pure-button" style="background-color: #d1d5db; color: #111; font-weight: 500; border-radius: 6px; padding: 0.5rem 1.5rem; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
                    Upload
                </span>
            </label>
            <!-- Hidden native file input -->
            <input id="video_file" name="video_file" type="file" accept="video/mp4,video/*" required style="display: none;" onchange="showFileName(this)">
            <!-- Filename feedback indicator -->
            <div id="file-name-display" style="margin-top: 0.5rem; font-size: 0.85rem; color: #555; font-weight: 500;"></div>
        </div>

        <!-- Main Grey Card Container -->
        <div style="background-color: #e5e5e5; border-radius: 12px; padding: 1.75rem; display: flex; flex-direction: column; gap: 1.2rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">
            
            <!-- Title Input -->
            <div>
                <input type="text" name="title" placeholder="Video Title" required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; background-color: #fff; font-size: 1rem;">
            </div>

            <!-- Category Selector -->
            <div>
                <select name="category" style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; background-color: #fff; font-size: 1rem;">
                    <option value="general" selected>General</option>
                    <option value="sport">Sport</option>
                    <option value="study">Study</option>
                    <option value="hobby">Hobby</option>
                </select>
            </div>

            <!-- Description Textarea (Matches wireframe placeholder) -->
            <div>
                <textarea name="description" placeholder="Type description, or whatever you want" style="width: 100%; height: 160px; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; background-color: #fff; font-size: 1rem; resize: vertical;"></textarea>
            </div>

            <!-- Submit Action Button -->
            <div>
                <button type="submit" class="pure-button pure-button-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem; border-radius: 6px; font-weight: 600;">
                    Publish Video
                </button>
            </div>

        </div>

    </form>
</div>

<!-- Simple script to display selected video file name -->
<script>
    function showFileName(input) {
        const display = document.getElementById('file-name-display');
        if (input.files && input.files[0]) {
            display.textContent = "Selected file: " + input.files[0].name;
        } else {
            display.textContent = "";
        }
    }
</script>
{% endblock %}
